<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویل برگر | مشهد</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0b0d;color:#f5f2ee;
  font-family:Tahoma,system-ui,sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.logo{
  width:92px;height:92px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(145deg,#1d1d21,#0e0e10);
  border:2px solid #e63946;
  display:flex;align-items:center;justify-content:center;font-size:40px;
  box-shadow:0 8px 30px rgba(230,57,70,.35);
}
h1{font-size:24px;font-weight:900;margin-bottom:4px}
h1 b{color:#e63946}
.tag{font-size:12px;letter-spacing:3px;color:#98928c;text-transform:uppercase;margin-bottom:36px}
.buttons{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
a.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 20px;border-radius:16px;text-decoration:none;
  font-weight:800;font-size:16px;border:1px solid #26262b;
  background:#151517;color:#f5f2ee;
}
a.btn.menu{background:#e63946;border-color:#e63946;color:#fff;
  box-shadow:0 6px 20px rgba(230,57,70,.35)}
a.btn.insta .ic{
  width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:inline-block;
  background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}
footer{margin-top:40px;font-size:11.5px;color:#98928c}
</style>
</head>
<body>
  <div class="logo">🍔</div>
  <h1>ویل <b>برگر</b></h1>
  <div class="tag">مشهد</div>

  <div class="buttons">
    <a class="btn menu" href="index.html">📋 مشاهده منو</a>
    <a class="btn insta" href="https://www.instagram.com/vealburger_mhd" target="_blank" rel="noopener">
      <span class="ic"></span> صفحه اینستاگرام
    </a>
  </div>

  <footer>ویل برگر — نبش هفت‌تیرِ ۲۴</footer>
</body>
</html>
